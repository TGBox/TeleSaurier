# Kopieren nach ~/.telesaurier/config.toml (Windows: C:\Users\<Name>\.telesaurier\config.toml)
# oder den Pfad über die Umgebungsvariable TELESAURIER_CONFIG angeben.
# Ohne Konfigurationsdatei startet TeleSaurier im Testmodus ohne Zammad.

[general]
# data_dir = "~/.telesaurier"

[fax]
# Wege zum Senden; der erste ist der Standard, die Oberfläche bietet alle zur Auswahl an.
# Bisher gibt es nur "simulated" (Testmodus, es wird nichts wirklich gefaxt).
# Geplant: "fritzbox" und "epson".
send = ["simulated"]
# Wege, über die eingehende Faxe abgeholt werden. Geplant: "mailbox" und "folder".
receive = ["simulated"]
# Bei "besetzt" oder "keine Antwort": höchstens so viele Versuche, mit dieser Pause dazwischen.
max_attempts = 3
retry_pause_seconds = 120

# Jeder Weg kann einen eigenen Abschnitt [fax.<name>] mit seinen Einstellungen haben.
# [fax.simulated]
# dir = "~/.telesaurier/simulated"

[zammad]
url = "https://zammad.example.com"
# Token besser über die Umgebungsvariable TELESAURIER_ZAMMAD_TOKEN setzen.
token = ""
# Name des Ticket-Attributs, in dem die Faxnummer des Empfängers steht.
fax_number_field = "fax_number"
# Gruppe und Kunde (E-Mail) für Tickets aus eingehenden Faxen.
inbound_group = "Users"
inbound_customer = ""
# Muss mit dem "HMAC SHA1 Signature Token" des Zammad-Webhooks übereinstimmen.
# Besser über TELESAURIER_WEBHOOK_SECRET setzen.
webhook_secret = ""

[server]
host = "127.0.0.1"
port = 8520
poll_seconds = 30
